# Prose linting. The word lists in styles/plain-english/ are the only copy of them, and
# hooks/check-prose.mjs shells out to this same binary with this same config.
#
# Run: npm run lint:prose
StylesPath = styles
MinAlertLevel = warning

# `Vale.Repetition` catches a word typed twice in a row. It lives inside the binary rather
# than in styles/, so it needs no rule file and no `vale sync`.
#
# Vale knows md, adoc, rst, html, xml, dita and org. Anything else is aliased here.
#
# A Vue single-file component holds three languages, and Vale reads one format per file.
# `vue = html` covers the template's prose. bin/lint-prose.mjs makes a second pass with
# `--ext=.ts` over the same bytes to reach the comments in the script and style blocks,
# which is where CSS, SCSS, JS and TS comments live. `//`, `///`, `/* */` and `/** */`
# are all read.
[formats]
mdx = md
vue = html

# Prose, in full.
[*.{md,mdx,html,vue}]
plain-english.vague = YES
plain-english.jargon = YES
plain-english.substitutions = YES
plain-english.british = YES
Vale.Repetition = YES

# Comments only. Vale finds the comment syntax from the extension, so this list has to
# name every language whose comments should be read.
[*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,scss,sass,css,rs,swift,py,go,kt,kts,rb,sh,bash,sql,toml,yml,yaml}]
plain-english.vague = YES
plain-english.jargon = YES
plain-english.substitutions = YES
plain-english.british = YES
Vale.Repetition = YES
