# Prose linting. The word lists in styles/plain-english/ are the only copy of them, and
# hooks/check-prose.mjs shells out to this same binary with this same config.
#
# Run: npm run lint:prose
StylesPath = styles
MinAlertLevel = warning

# Vale knows md, adoc, rst, html, xml, dita and org. Anything else is aliased here.
#
# A Vue single-file component holds three languages, and Vale reads one format per file.
# `vue = html` covers the template's prose. bin/lint-prose.mjs makes a second pass with
# `--ext=.ts` over the same bytes to reach the comments in the script and style blocks,
# which is where CSS, SCSS, JS and TS comments live. `//`, `///`, `/* */` and `/** */`
# are all read.
[formats]
mdx = md
vue = html

# Every file is prose until the skip section below names it. That is the default because
# the opposite, a list of extensions to check, let a commit message written to a `.txt`
# file through unread, and would do the same for the next format nobody thought to add.
#
# A source file needs no entry of its own. Vale finds the comment syntax from the
# extension and reads the comments rather than the code, whichever section matched. A
# `.ts` file reports its `//` lines and says nothing about a string literal.
#
# `Vale.Repetition` catches a word typed twice in a row. It lives inside the binary rather
# than in styles/, so it needs no rule file and no `vale sync`. The rest of the `Vale`
# style stays off, because `Vale.Spelling` reports every identifier in a comment.
[*]
BasedOnStyles = plain-english
Vale.Repetition = YES

# Data rather than prose. Vale reads a format it does not know as one long sentence, so
# `"a robust plan"` inside a JSON string value gets reported the same as a paragraph.
#
# This is the list to edit. An extension added here is skipped everywhere. One project
# overrides the whole file by putting its own `.vale.ini` above the files it covers:
# `configFor` in lib/prose.mjs walks up from each file and uses the nearest one.
#
# Binary formats are not here. lib/prose.mjs never opens those, so Vale never sees them.
[*.{json,json5,jsonc,jsonl,ndjson,geojson,topojson,ipynb,csv,tsv,psv,xml,xsd,dtd,xsl,plist,storyboard,xib,pbxproj,entitlements,svg,lock,sum,resolved,snap,ambr,golden,approved,po,pot,mo,xliff,xlf,strings,stringsdict,arb,resx,properties,env,har,tfstate,pem,crt,cer,csr,patch,diff,log,srt,vtt,sbv,bak,tmp}]
BasedOnStyles =
Vale.Repetition = NO
