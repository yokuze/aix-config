# Words with a plain replacement. Reported, not blocked: some have a legitimate use when
# quoting a spec, an API name, or someone else's copy, and a false positive should not
# stop a turn.
#
# A word with no such use belongs in substitutions-strict.yml, which blocks and keeps this
# same message. Every word left here has a real exception, recorded beside it.
#
# Keys are regular expressions. Verb forms are spelled out, because Vale matches the
# pattern literally and does not stem: "leverage" alone will not catch "leverages".
#
# Consumed by vale (npm: @vvago/vale) and by hooks/check-prose.mjs, which shells out to it.
extends: substitution
message: "Write '%s' instead of '%s'."
level: warning
ignorecase: true
swap:
  # `highlight` is the text-marking feature in a reader app, so the noun and the verb both
  # have a correct use.
  highlight(?:s|ed|ing)?: show
  paradigm: approach
  landscape: name the subject, or "orientation" for a screen
  # `intrinsic` is a CSS keyword: `width: intrinsic`, intrinsic sizing.
  intrinsic: built in
  nuanced: say what the distinction is
  intricate: say what makes it complex
  # "Tightened the bound" and "a hardened build" both say something real.
  hardened: say what changed
  tightened: say what changed
  # "Drove the app from the webview" describes running a test against a live app.
  drove: led
  # The abstract sense is the problem: "where a new flow lands". A ball landing in a
  # target ring and a plane landing are the literal verb, so this reports rather than
  # blocks. vague.yml still blocks the form before a preposition, "lands on the root".
  "lands(?!\\s*page)": give the identifier or the value
  rallied: say what happened
  "under the hood": internally
  # A quoted spec can use either.
  "not only": say the thing once
  "and/or": pick one, or write "X, or Y, or both"
