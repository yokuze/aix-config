# Words with a more specific replacement that depends on the subject. Reported, not
# blocked.
#
# This is jargon.yml's question at a lower severity. A word belongs here when the plain
# version is almost always better but the exception is real. "The node holds content"
# needs a real verb, and "the assumptions hold" is already correct.
#
# Blocking those would make the writer argue with the hook instead of picking a word, so
# hooks/check-prose.mjs prints these under "Also reported, your call" and lets the turn
# finish.
#
# Consumed by vale (npm: @vvago/vale) and by hooks/check-prose.mjs, which shells out to it.
extends: existence
message: "'%s' stands in for a more specific word. Write that word."
level: warning
ignorecase: true
tokens:
  - holds?
  # The bare verb and the gerund. "Some files name the banned words" wants "list", and
  # "start by naming the stores" is already right, so this reports rather than blocks.
  # `names` and `named` have no such correct use and are blocked in jargon.yml.
  - (?-i)nam(?:e|ing)\s+(?:the|a|an|its|their|our|this|that|these|those|what|which|where)
